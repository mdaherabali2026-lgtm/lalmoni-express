<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <title>ব্যানার মেকার প্রো</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .press-effect {
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s;
    }
    .press-effect:active {
      transform: scale(0.95);
      opacity: 0.85;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .page-view {
      transition: opacity 0.25s ease-in-out, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .page-hidden {
      display: none;
      opacity: 0;
      transform: translateY(12px);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-slate-800 antialiased pb-24">

  <!-- ================= মোবাইল হেডার ================= -->
  <header class="bg-[#B91C1C] text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button class="p-1.5 press-effect rounded-lg hover:bg-white/10">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center gap-2">
          <span class="text-xl">🚩</span>
          <h1 class="text-lg font-bold tracking-tight">ব্যানার মেকার প্রো</h1>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button class="p-2 press-effect rounded-full hover:bg-white/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
        </button>
        <div class="relative">
          <button class="p-2 press-effect rounded-full hover:bg-white/10">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          </button>
          <span class="absolute top-1.5 right-1.5 bg-white text-[#B91C1C] text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center border border-[#B91C1C] shadow-sm">3</span>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-md mx-auto">

    <!-- ================= হোম পেজ ভিউ ================= -->
    <main id="homePage" class="page-view px-4 pt-4 space-y-6">

      <!-- স্লাইডার ব্যানার -->
      <section class="relative overflow-hidden rounded-2xl shadow-sm bg-slate-900 aspect-[16/9]">
        <div class="w-full h-full relative">
          <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover opacity-80">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-4 text-white">
            <span class="text-xs bg-red-600 font-bold px-2 py-0.5 rounded-full w-max mb-1">অফার</span>
            <h3 class="text-base font-bold">বিশ্ব শান্তি ও সম্প্রীতি দিবস</h3>
            <p class="text-xs text-slate-200">হিংসা নয়, মানবতার জয় হোক...</p>
          </div>
        </div>
      </section>

      <!-- ক্যাটাগরি -->
      <section class="space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-bold text-slate-900">ব্যানার ক্যাটাগরি</h2>
          <button class="text-xs font-semibold text-[#B91C1C] press-effect">সব দেখুন &rsaquo;</button>
        </div>
        <div id="categoryContainer" class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
          <div class="text-xs text-slate-400">ক্যাটাগরি লোড হচ্ছে...</div>
        </div>
      </section>

      <!-- জনপ্রিয় টেমপ্লেট -->
      <section class="space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-bold text-slate-900">জনপ্রিয় টেমপ্লেট</h2>
          <button class="text-xs font-semibold text-[#B91C1C] press-effect">আরও দেখুন &rsaquo;</button>
        </div>
        <div id="templateGrid" class="grid grid-cols-2 gap-3.5">
          <div class="col-span-2 text-center py-10 text-xs text-slate-400">টেমপ্লেট লোড হচ্ছে...</div>
        </div>
      </section>

    </main>

    <!-- ================= পূর্ণাঙ্গ এডিটর স্ক্রিন ভিউ ================= -->
    <div id="editorPage" class="page-view page-hidden px-4 pt-3 space-y-4">
      
      <!-- এডিটর বার -->
      <div class="flex items-center justify-between pb-2 border-b border-slate-200">
        <button id="closeEditorBtn" class="p-1.5 press-effect rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="text-center">
          <h2 id="editorTitle" class="text-sm font-bold text-slate-800 leading-tight">ব্যানার এডিটর</h2>
          <span class="text-[10px] text-emerald-600 font-semibold flex items-center justify-center gap-1">● লাইভ প্রিভিউ</span>
        </div>
        <button id="downloadBannerBtn" class="bg-[#B91C1C] text-white text-xs font-bold px-3.5 py-1.5 rounded-xl shadow-md flex items-center gap-1.5 press-effect">
          <span>ডাউনলোড</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        </button>
      </div>

      <!-- ইন্টারঅ্যাক্টিভ ব্যানার ক্যানভাস -->
      <div class="relative w-full rounded-2xl overflow-hidden shadow-lg border border-slate-200 bg-white aspect-[3/4] flex items-center justify-center" id="editorCanvasWrapper">
        
        <!-- লেয়ার ১: ব্যবহারকারীর ছবি (স্বচ্ছ ফ্রেমের নিচে) -->
        <div id="userPhotoSlot" class="absolute overflow-hidden z-10 hidden" style="transform: translate(-50%, -50%);">
          <img id="userRenderedImg" class="w-full h-full object-cover">
        </div>

        <!-- লেয়ার ২: মূল টেমপ্লেট ফ্রেম (স্বচ্ছ পিএনজি) -->
        <img id="templateFrameImg" class="absolute inset-0 w-full h-full object-contain pointer-events-none z-20">

        <!-- লেয়ার ৩: টেক্সট ওভারলে -->
        <div id="textOverlayContainer" class="absolute inset-0 w-full h-full pointer-events-none z-30"></div>
      </div>

      <!-- ইনপুট ও ছবি আপলোড সেকশন -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
        
        <!-- ফটো স্লট বাটন -->
        <div id="photoInputSection" class="hidden p-3 bg-amber-50/70 border border-amber-200/60 rounded-xl flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-amber-900">📷 নিজের ছবি যুক্ত করুন</div>
            <div class="text-[10px] text-amber-700">স্বচ্ছ ফ্রেমের নিচে ছবি সেট হবে</div>
          </div>
          <label class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer press-effect shadow-sm">
            ছবি নির্বাচন
            <input type="file" id="userPhotoInput" accept="image/*" class="hidden">
          </label>
        </div>

        <!-- ফিল্ডস -->
        <div class="space-y-3">
          <div class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <span>✍️</span> ব্যানারের তথ্য লিখুন
          </div>
          <div id="dynamicInputFields" class="space-y-2.5"></div>
        </div>

      </div>

    </div>

  </div>

  <!-- ================= বটম ন্যাভিগেশন বার ================= -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200/80 px-6 py-2 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center text-[11px] font-semibold text-slate-500">
      
      <button class="nav-item flex flex-col items-center gap-1 text-[#B91C1C] press-effect" onclick="showHome()">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
        <span>হোম</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-1 press-effect hover:text-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span>আমার তৈরি</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-1 press-effect hover:text-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
        <span>সংরক্ষিত</span>
      </button>

      <button class="nav-item flex flex-col items-center gap-1 press-effect hover:text-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span>প্রোফাইল</span>
      </button>

    </div>
  </nav>

  <!-- অদৃশ্য এক্সপোর্ট ক্যানভাস -->
  <canvas id="exportCanvas" class="hidden"></canvas>

  <script type="module">
    const PROJECT_ID = "gen-lang-client-0426695413";
    const DATABASE_ID = "ai-studio-android-bannerma-f2849996-4b44-4c8a-97d3-1ccdabf16774";
    const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/${DATABASE_ID}/documents`;

    let activeTemplate = null;
    let userUploadedImageObj = null;
    let textState = {};

    window.showHome = function() {
      document.getElementById("editorPage").classList.add("page-hidden");
      document.getElementById("homePage").classList.remove("page-hidden");
    };

    function openEditor(template) {
      activeTemplate = template;
      textState = {};

      document.getElementById("editorTitle").innerText = template.title;
      document.getElementById("templateFrameImg").src = template.fullImageUrl || template.previewUrl;

      // ফটো স্লট সেটআপ
      const photoSlot = document.getElementById("userPhotoSlot");
      const photoInputSection = document.getElementById("photoInputSection");
      if (template.hasPhotoSlot) {
        photoInputSection.classList.remove("hidden");
        photoSlot.style.left = `${template.photoSlotX || 50}%`;
        photoSlot.style.top = `${template.photoSlotY || 35}%`;
        photoSlot.style.width = `${template.photoSlotSize || 45}%`;
        photoSlot.style.height = `${template.photoSlotSize || 45}%`;
        photoSlot.classList.remove("hidden");
      } else {
        photoInputSection.classList.add("hidden");
        photoSlot.classList.add("hidden");
      }

      // ইনপুট ফিল্ড ও ক্যানভাস টেক্সট তৈরি
      const inputContainer = document.getElementById("dynamicInputFields");
      const overlayContainer = document.getElementById("textOverlayContainer");
      inputContainer.innerHTML = "";
      overlayContainer.innerHTML = "";

      template.inputFields.forEach(f => {
        textState[f.id] = f.placeholder || f.label;

        // ইনপুট বক্স
        const fieldRow = document.createElement("div");
        fieldRow.className = "flex flex-col gap-1";
        fieldRow.innerHTML = `
          <label class="text-[11px] font-semibold text-slate-500">${f.label}</label>
          <input type="text" data-id="${f.id}" value="${textState[f.id]}" 
                 class="w-full text-xs px-3 py-2 border rounded-xl focus:ring-2 focus:ring-[#B91C1C] outline-none bg-slate-50 text-slate-800">
        `;
        const inputElem = fieldRow.querySelector("input");
        inputElem.addEventListener("input", (e) => {
          textState[f.id] = e.target.value;
          const el = document.getElementById(`overlay_${f.id}`);
          if (el) el.innerText = e.target.value;
        });
        inputContainer.appendChild(fieldRow);

        // ক্যানভাসে টেক্সট
        const overlaySpan = document.createElement("span");
        overlaySpan.id = `overlay_${f.id}`;
        overlaySpan.className = "absolute font-bold pointer-events-none transform -translate-x-1/2 -translate-y-1/2 whitespace-nowrap";
        overlaySpan.style.left = `${f.x}%`;
        overlaySpan.style.top = `${f.y}%`;
        overlaySpan.style.color = f.textColor || "#000000";
        overlaySpan.style.fontSize = `${Math.max(8, f.fontSize * 0.45)}px`;
        overlaySpan.innerText = textState[f.id];
        overlayContainer.appendChild(overlaySpan);
      });

      document.getElementById("homePage").classList.add("page-hidden");
      document.getElementById("editorPage").classList.remove("page-hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById("closeEditorBtn").addEventListener("click", showHome);

    // ইউজার ফটো লোডার
    document.getElementById("userPhotoInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userUploadedImageObj = img;
            document.getElementById("userRenderedImg").src = evt.target.result;
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // ডাটা ফেচিং
    async function fetchPublicData() {
      try {
        // ক্যাটাগরি ফেচ
        const catRes = await fetch(`${FIRESTORE_BASE}/categories`);
        const catData = await catRes.json();
        const catContainer = document.getElementById("categoryContainer");
        catContainer.innerHTML = "";

        const colors = [
          'bg-pink-100 text-pink-700',
          'bg-amber-100 text-amber-700',
          'bg-sky-100 text-sky-700',
          'bg-purple-100 text-purple-700',
          'bg-emerald-100 text-emerald-700'
        ];

        if (catData.documents) {
          catData.documents.forEach((doc, idx) => {
            const f = doc.fields || {};
            const name = f.name?.stringValue || "ক্যাটাগরি";
            const icon = f.icon?.stringValue || "🏷️";
            const colorClass = colors[idx % colors.length];

            const item = document.createElement("div");
            item.className = "flex flex-col items-center gap-1.5 flex-shrink-0 press-effect cursor-pointer";
            item.innerHTML = `
              <div class="w-14 h-14 rounded-2xl ${colorClass} flex items-center justify-center text-2xl shadow-sm">
                ${icon}
              </div>
              <span class="text-xs font-semibold text-slate-700">${name}</span>
            `;
            catContainer.appendChild(item);
          });
        }

        // টেমপ্লেট ফেচ
        const tempRes = await fetch(`${FIRESTORE_BASE}/templates`);
        const tempData = await tempRes.json();
        const templateGrid = document.getElementById("templateGrid");
        templateGrid.innerHTML = "";

        if (tempData.documents) {
          tempData.documents.forEach(doc => {
            const f = doc.fields || {};
            let parsedFields = [];
            if (f.inputFields?.arrayValue?.values) {
              parsedFields = f.inputFields.arrayValue.values.map(v => {
                const mf = v.mapValue?.fields || {};
                return {
                  id: mf.id?.stringValue || "",
                  label: mf.label?.stringValue || "",
                  placeholder: mf.placeholder?.stringValue || "",
                  x: mf.x?.doubleValue !== undefined ? mf.x.doubleValue : 50,
                  y: mf.y?.doubleValue !== undefined ? mf.y.doubleValue : 50,
                  fontSize: Number(mf.fontSize?.integerValue || 20),
                  textColor: mf.textColor?.stringValue || "#000000"
                };
              });
            }

            const item = {
              title: f.title?.stringValue || "বিবাহ স্মরণিকা",
              previewUrl: f.previewUrl?.stringValue || "",
              fullImageUrl: f.fullImageUrl?.stringValue || f.previewUrl?.stringValue,
              hasPhotoSlot: f.hasPhotoSlot?.booleanValue || false,
              photoSlotX: f.photoSlotX?.doubleValue !== undefined ? f.photoSlotX.doubleValue : 50,
              photoSlotY: f.photoSlotY?.doubleValue !== undefined ? f.photoSlotY.doubleValue : 35,
              photoSlotSize: Number(f.photoSlotSize?.integerValue || 45),
              inputFields: parsedFields
            };

            const card = document.createElement("div");
            card.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200/80 flex flex-col justify-between";
            card.innerHTML = `
              <div class="relative aspect-[3/4] bg-slate-100 overflow-hidden">
                <img src="${item.previewUrl}" class="w-full h-full object-cover">
                <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full font-medium">
                  👁️ ৭ বার ব্যবহৃত
                </span>
              </div>
              <div class="p-3 space-y-2">
                <h3 class="text-xs font-bold text-slate-800 truncate">${item.title}</h3>
                <button class="create-btn w-full bg-[#B91C1C] hover:bg-red-800 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm press-effect">
                  <span>✏️ Create</span>
                </button>
              </div>
            `;
            card.querySelector(".create-btn").addEventListener("click", () => openEditor(item));
            templateGrid.appendChild(card);
          });
        }
      } catch (e) {
        console.error("Data load error:", e);
      }
    }

    // এইচডি ব্যানার ডাউনলোড
    document.getElementById("downloadBannerBtn").addEventListener("click", async () => {
      const btn = document.getElementById("downloadBannerBtn");
      btn.innerText = "রেন্ডার হচ্ছে...";
      btn.disabled = true;

      const canvas = document.getElementById("exportCanvas");
      const ctx = canvas.getContext("2d");

      const baseImg = new Image();
      baseImg.crossOrigin = "anonymous";
      baseImg.src = activeTemplate.fullImageUrl || activeTemplate.previewUrl;

      baseImg.onload = () => {
        canvas.width = baseImg.naturalWidth;
        canvas.height = baseImg.naturalHeight;

        // লেয়ার ১: ইউজারের ফটো ড্র করা
        if (activeTemplate.hasPhotoSlot && userUploadedImageObj) {
          const slotW = (canvas.width * (activeTemplate.photoSlotSize || 45)) / 100;
          const slotH = slotW;
          const slotX = (canvas.width * (activeTemplate.photoSlotX || 50)) / 100 - (slotW / 2);
          const slotY = (canvas.height * (activeTemplate.photoSlotY || 35)) / 100 - (slotH / 2);

          ctx.save();
          ctx.beginPath();
          ctx.rect(slotX, slotY, slotW, slotH);
          ctx.clip();
          ctx.drawImage(userUploadedImageObj, slotX, slotY, slotW, slotH);
          ctx.restore();
        }

        // লেয়ার ২: ফ্রেম ব্যাকগ্রাউন্ড
        ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);

        // লেয়ার ৩: টেক্সট ওভারলে ড্র করা
        activeTemplate.inputFields.forEach(f => {
          const text = textState[f.id] || f.placeholder || f.label;
          const posX = (canvas.width * f.x) / 100;
          const posY = (canvas.height * f.y) / 100;

          const scaleFactor = canvas.width / 600;
          const fontSize = f.fontSize * scaleFactor;

          ctx.font = `bold ${fontSize}px 'Hind Siliguri', sans-serif`;
          ctx.fillStyle = f.textColor || "#000000";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(text, posX, posY);
        });

        // ডাউনলোড শুরু
        const link = document.createElement("a");
        link.download = `${activeTemplate.title}_Banner.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();

        btn.innerHTML = `<span>ডাউনলোড</span><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`;
        btn.disabled = false;
      };
    });

    fetchPublicData();
  </script>
</body>
