  <canvas id="exportCanvas" class="hidden"></canvas>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyANmFjDSGfdXhMfCUMgpurd1Jw_tVsrnWQ",
      authDomain: "banner-maker-pro.firebaseapp.com",
      projectId: "banner-maker-pro",
      storageBucket: "banner-maker-pro.firebasestorage.app",
      messagingSenderId: "83426747166",
      appId: "1:83426747166:web:eb0ed6daef0ed6019c9f0f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let allTemplates = [];
    let currentCategory = "all";
    let activeTemplate = null;
    let userUploadedImageObj = null;
    let textState = {};
    let sliderTimer = null;
    let currentSlideIdx = 0;
    let slidesData = [];

    // ================= ইংরেজি তারিখ থেকে বঙ্গাব্দ ও বার কনভার্টার =================
    const bnNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    function toBnNum(n) {
      return n.toString().split('').map(d => bnNums[d] || d).join('');
    }

    const enMonthsBn = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
    const bnDays = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];
    const bnMonths = ["বৈশাখ", "জ্যৈষ্ঠ", "আষাঢ়", "শ্রাবণ", "ভাদ্র", "আশ্বিন", "কার্তিক", "অগ্রহায়ণ", "পৌষ", "মাঘ", "ফাল্গুন", "চৈত্র"];

    function isLeapYear(y) {
      return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
    }

    function formatDualDate(dateStr) {
      if (!dateStr) return "";
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return dateStr;

      const d = date.getDate();
      const m = date.getMonth(); // 0-based
      const y = date.getFullYear();
      const dayName = bnDays[date.getDay()];

      // ইংরেজি অংশ
      const engPart = `${toBnNum(d)} ${enMonthsBn[m]} ${toBnNum(y)} ইংরেজি`;

      // বাংলা বঙ্গাব্দ ক্যালকুলেশন (সংশোধিত বাংলা একাডেমী ক্যালেন্ডার)
      let bYear = y - 593;
      let bMonthIdx = 0;
      let bDay = 1;

      const falgDayCount = isLeapYear(y) ? 30 : 29;
      // ১৪ এপ্রিল থেকে নতুন বঙ্গাব্দ শুরু
      const daysInBnMonths = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, falgDayCount, 30];

      const startOfBYear = new Date(y, 3, 14); // ১৪ এপ্রিল
      if (date < startOfBYear) {
        bYear = y - 594;
        const prevStart = new Date(y - 1, 3, 14);
        let diffDays = Math.floor((date - prevStart) / (1000 * 60 * 60 * 24));
        
        const prevFalg = isLeapYear(y) ? 30 : 29;
        const prevDaysInBnMonths = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, prevFalg, 30];

        for (let i = 0; i < 12; i++) {
          if (diffDays < prevDaysInBnMonths[i]) {
            bMonthIdx = i;
            bDay = diffDays + 1;
            break;
          }
          diffDays -= prevDaysInBnMonths[i];
        }
      } else {
        let diffDays = Math.floor((date - startOfBYear) / (1000 * 60 * 60 * 24));
        for (let i = 0; i < 12; i++) {
          if (diffDays < daysInBnMonths[i]) {
            bMonthIdx = i;
            bDay = diffDays + 1;
            break;
          }
          diffDays -= daysInBnMonths[i];
        }
      }

      const bngPart = `${toBnNum(bDay)} ${bnMonths[bMonthIdx]} ${toBnNum(bYear)} বঙ্গাব্দ`;
      return `${engPart} | ${bngPart} | রোজ ${dayName}`;
    }

    window.showHome = function() {
      document.getElementById("editorPage").classList.add("page-hidden");
      document.getElementById("homePage").classList.remove("page-hidden");
    };

    async function loadSliders() {
      const sliderContent = document.getElementById("sliderContent");
      const sliderDots = document.getElementById("sliderDots");

      try {
        const snap = await db.collection("sliders").get();
        slidesData = [];
        snap.forEach(doc => slidesData.push({ id: doc.id, ...doc.data() }));

        if (slidesData.length === 0) {
          slidesData = [{
            imageUrl: "https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80",
            title: "বিশ্ব শান্তি ও সম্প্রীতি দিবস",
            subTitle: "হিংসা নয়, মানবতার জয় হোক...",
            badge: "অফার"
          }];
        }

        sliderContent.innerHTML = "";
        sliderDots.innerHTML = "";

        slidesData.forEach((s, idx) => {
          const slide = document.createElement("div");
          slide.className = `slide-item absolute inset-0 w-full h-full ${idx === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'}`;
          slide.id = `slide_${idx}`;
          slide.innerHTML = `
            <img src="${s.imageUrl}" class="w-full h-full object-cover opacity-80">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-4 text-white">
              ${s.badge ? `<span class="text-xs bg-red-600 font-bold px-2 py-0.5 rounded-full w-max mb-1">${s.badge}</span>` : ''}
              <h3 class="text-base font-bold">${s.title || ''}</h3>
              <p class="text-xs text-slate-200">${s.subTitle || ''}</p>
            </div>
          `;
          sliderContent.appendChild(slide);

          const dot = document.createElement("div");
          dot.className = `w-2 h-2 rounded-full transition-all duration-300 ${idx === 0 ? 'bg-white w-4' : 'bg-white/50'}`;
          dot.id = `dot_${idx}`;
          sliderDots.appendChild(dot);
        });

        if (slidesData.length > 1) {
          if (sliderTimer) clearInterval(sliderTimer);
          sliderTimer = setInterval(() => {
            const nextIdx = (currentSlideIdx + 1) % slidesData.length;
            goToSlide(nextIdx);
          }, 4500);
        }

      } catch (e) {
        console.error("Slider error:", e);
      }
    }

    function goToSlide(idx) {
      document.getElementById(`slide_${currentSlideIdx}`)?.classList.replace('opacity-100', 'opacity-0');
      document.getElementById(`slide_${currentSlideIdx}`)?.classList.replace('z-10', 'z-0');
      document.getElementById(`dot_${currentSlideIdx}`)?.classList.replace('w-4', 'w-2');
      document.getElementById(`dot_${currentSlideIdx}`)?.classList.replace('bg-white', 'bg-white/50');

      currentSlideIdx = idx;

      document.getElementById(`slide_${currentSlideIdx}`)?.classList.replace('opacity-0', 'opacity-100');
      document.getElementById(`slide_${currentSlideIdx}`)?.classList.replace('z-0', 'z-10');
      document.getElementById(`dot_${currentSlideIdx}`)?.classList.replace('w-2', 'w-4');
      document.getElementById(`dot_${currentSlideIdx}`)?.classList.replace('bg-white/50', 'bg-white');
    }

    async function loadData() {
      try {
        const catRes = await db.collection("categories").get();
        const catContainer = document.getElementById("categoryContainer");
        catContainer.innerHTML = "";

        const allCat = document.createElement("div");
        allCat.className = "flex flex-col items-center gap-1.5 flex-shrink-0 press-effect cursor-pointer";
        allCat.onclick = () => filterTemplates("all");
        allCat.innerHTML = `
          <div id="cat_all" class="w-14 h-14 rounded-2xl bg-red-100 text-red-700 flex items-center justify-center text-xl font-bold shadow-sm border-2 border-red-500">
            সব
          </div>
          <span class="text-xs font-bold text-slate-800">সকল ব্যানার</span>
        `;
        catContainer.appendChild(allCat);

        const colors = [
          { bg: 'bg-pink-100', text: 'text-pink-700' },
          { bg: 'bg-amber-100', text: 'text-amber-700' },
          { bg: 'bg-sky-100', text: 'text-sky-700' },
          { bg: 'bg-purple-100', text: 'text-purple-700' },
          { bg: 'bg-emerald-100', text: 'text-emerald-700' }
        ];

        let cIdx = 0;
        catRes.forEach(doc => {
          const d = doc.data();
          const name = d.name || doc.id;
          const icon = d.icon || "🏷️";
          const theme = colors[cIdx % colors.length];
          cIdx++;

          const item = document.createElement("div");
          item.className = "flex flex-col items-center gap-1.5 flex-shrink-0 press-effect cursor-pointer";
          item.onclick = () => filterTemplates(name);
          item.innerHTML = `
            <div id="cat_${name}" class="w-14 h-14 rounded-2xl ${theme.bg} ${theme.text} flex items-center justify-center text-2xl shadow-sm border border-transparent">
              ${icon}
            </div>
            <span class="text-xs font-semibold text-slate-700">${name}</span>
          `;
          catContainer.appendChild(item);
        });

        const tempRes = await db.collection("templates").orderBy("createdAt", "desc").get();
        allTemplates = [];

        tempRes.forEach(doc => {
          const data = doc.data();
          allTemplates.push({
            id: doc.id,
            title: data.title || "ব্যানার",
            category: data.category || "সাধারণ",
            previewUrl: data.previewUrl || "",
            fullImageUrl: data.fullImageUrl || data.previewUrl,
            hasPhotoSlot: data.hasPhotoSlot || false,
            photoSlotX: data.photoSlotX !== undefined ? data.photoSlotX : 50,
            photoSlotY: data.photoSlotY !== undefined ? data.photoSlotY : 35,
            photoSlotSize: data.photoSlotSize || 45,
            inputFields: data.inputFields || []
          });
        });

        renderTemplates();

      } catch (e) {
        console.error("Data load error:", e);
      }
    }

    window.filterTemplates = function(category) {
      currentCategory = category;

      document.querySelectorAll('#categoryContainer > div > div').forEach(el => {
        el.classList.remove('border-2', 'border-red-500');
        el.classList.add('border-transparent');
      });
      const activeBtn = document.getElementById(category === 'all' ? 'cat_all' : `cat_${category}`);
      if (activeBtn) activeBtn.classList.add('border-2', 'border-red-500');

      document.getElementById("templateSectionTitle").innerText = category === 'all' ? 'জনপ্রিয় টেমপ্লেট' : `${category} ব্যানারসমূহ`;
      renderTemplates();
    };

    function renderTemplates() {
      const templateGrid = document.getElementById("templateGrid");
      templateGrid.innerHTML = "";

      const filtered = currentCategory === "all" 
        ? allTemplates 
        : allTemplates.filter(t => t.category === currentCategory);

      document.getElementById("templateCount").innerText = `${filtered.length}টি টেমপ্লেট`;

      if (filtered.length === 0) {
        templateGrid.innerHTML = `<div class="col-span-2 text-center py-12 text-xs text-slate-400">এই ক্যাটাগরিতে এখনো কোনো টেমপ্লেট যুক্ত করা হয়নি।</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200/80 flex flex-col justify-between";
        card.innerHTML = `
          <div class="relative aspect-[3/4] bg-slate-100 overflow-hidden">
            <img src="${item.previewUrl}" class="w-full h-full object-cover">
          </div>
          <div class="p-3 space-y-2">
            <h3 class="text-xs font-bold text-slate-800 truncate">${item.title}</h3>
            <button class="create-btn w-full bg-[#B91C1C] hover:bg-red-800 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm press-effect">
              <span>✏️ তৈরি করুন</span>
            </button>
          </div>
        `;
        card.querySelector(".create-btn").addEventListener("click", () => openEditor(item));
        templateGrid.appendChild(card);
      });
    }

    function openEditor(template) {
      activeTemplate = template;
      textState = {};

      document.getElementById("editorTitle").innerText = template.title;
      document.getElementById("templateFrameImg").src = template.fullImageUrl || template.previewUrl;

      const photoSlot = document.getElementById("userPhotoSlot");
      const photoInputSection = document.getElementById("photoInputSection");
      if (template.hasPhotoSlot) {
        photoInputSection.classList.remove("hidden");
        photoSlot.style.left = `${template.photoSlotX || 50}%`;
        photoSlot.style.top = `${template.photoSlotY || 35}%`;
        photoSlot.style.width = `${template.photoSlotSize || 45}%`;
        photoSlot.style.height = `${template.photoSlotSize || 45}%`;
        photoSlot.classList.remove("hidden");
      } else {
        photoInputSection.classList.add("hidden");
        photoSlot.classList.add("hidden");
      }

      const inputContainer = document.getElementById("dynamicInputFields");
      const overlayContainer = document.getElementById("textOverlayContainer");
      inputContainer.innerHTML = "";
      overlayContainer.innerHTML = "";

      if (template.inputFields && Array.isArray(template.inputFields)) {
        template.inputFields.forEach(f => {
          textState[f.id] = f.placeholder || "";

          const fieldRow = document.createElement("div");
          fieldRow.className = "flex flex-col gap-1";

          if (f.id === "event_date" || f.type === "date") {
            // ক্যালেন্ডার ইনপুট ফিল্ড
            fieldRow.innerHTML = `
              <label class="text-[11px] font-semibold text-slate-600 flex items-center justify-between">
                <span>📅 ${f.label} (ক্যালেন্ডার থেকে নির্বাচন করুন)</span>
              </label>
              <input type="date" data-id="${f.id}" 
                     class="w-full text-xs px-3 py-2 border rounded-xl focus:ring-2 focus:ring-[#B91C1C] outline-none bg-slate-50 text-slate-800">
            `;
            const dateInput = fieldRow.querySelector("input");
            dateInput.addEventListener("change", (e) => {
              const converted = formatDualDate(e.target.value);
              textState[f.id] = converted;
              const el = document.getElementById(`overlay_${f.id}`);
              if (el) el.innerText = converted;
            });
          } else {
            // সাধারণ টেক্সট ইনপুট ফিল্ড
            fieldRow.innerHTML = `
              <label class="text-[11px] font-semibold text-slate-600">${f.label}</label>
              <input type="text" data-id="${f.id}" value="${textState[f.id]}" placeholder="${f.prefix || ''}লিখুন..." 
                     class="w-full text-xs px-3 py-2 border rounded-xl focus:ring-2 focus:ring-[#B91C1C] outline-none bg-slate-50 text-slate-800">
            `;
            const inputElem = fieldRow.querySelector("input");
            inputElem.addEventListener("input", (e) => {
              textState[f.id] = e.target.value;
              const el = document.getElementById(`overlay_${f.id}`);
              if (el) {
                // ইউজার না লিখলে শুধু প্রিফিক্স দেখাবে
                el.innerText = (f.prefix || "") + (e.target.value ? e.target.value : "");
              }
            });
          }

          inputContainer.appendChild(fieldRow);

          let alignClass = "-translate-x-1/2";
          if (f.align === "left") alignClass = "translate-x-0";
          if (f.align === "right") alignClass = "-translate-x-full";

          const overlaySpan = document.createElement("span");
          overlaySpan.id = `overlay_${f.id}`;
          overlaySpan.className = `absolute font-bold pointer-events-none transform ${alignClass} -translate-y-1/2 whitespace-nowrap`;
          overlaySpan.style.left = `${f.x}%`;
          overlaySpan.style.top = `${f.y}%`;
          overlaySpan.style.color = f.textColor || "#000000";
          overlaySpan.style.fontSize = `${Math.max(6, (f.fontSize || 16) * 0.45)}px`;
          overlaySpan.style.fontFamily = `'${f.fontFamily || "Hind Siliguri"}', sans-serif`;
          
          // প্রাথমিক অবস্থায় শুধু লেবেল / প্রিফিক্স
          overlaySpan.innerText = (f.prefix || "") + textState[f.id];
          overlayContainer.appendChild(overlaySpan);
        });
      }

      document.getElementById("homePage").classList.add("page-hidden");
      document.getElementById("editorPage").classList.remove("page-hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById("closeEditorBtn").addEventListener("click", showHome);

    document.getElementById("userPhotoInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            userUploadedImageObj = img;
            document.getElementById("userRenderedImg").src = evt.target.result;
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // ================= নিখুঁত সাইজ ও পজিশনে ডাউনলোড ইঞ্জিন =================
    document.getElementById("downloadBannerBtn").addEventListener("click", async () => {
      const btn = document.getElementById("downloadBannerBtn");
      btn.innerText = "রেন্ডার হচ্ছে...";
      btn.disabled = true;

      await document.fonts.ready;

      const canvas = document.getElementById("exportCanvas");
      const ctx = canvas.getContext("2d");

      const baseImg = new Image();
      baseImg.crossOrigin = "anonymous";
      baseImg.src = activeTemplate.fullImageUrl || activeTemplate.previewUrl;

      baseImg.onload = () => {
        const origWidth = baseImg.naturalWidth;
        const origHeight = baseImg.naturalHeight;

        canvas.width = origWidth;
        canvas.height = origHeight;

        const slotW = (origWidth * (activeTemplate.photoSlotSize || 45)) / 100;
        const slotH = slotW;
        const slotX = (origWidth * (activeTemplate.photoSlotX || 50)) / 100 - (slotW / 2);
        const slotY = (origHeight * (activeTemplate.photoSlotY || 35)) / 100 - (slotH / 2);

        // লেয়ার ১: ইউজার ফটো
        if (activeTemplate.hasPhotoSlot) {
          if (userUploadedImageObj) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(slotX, slotY, slotW, slotH);
            ctx.clip();
            ctx.drawImage(userUploadedImageObj, slotX, slotY, slotW, slotH);
            ctx.restore();
          } else {
            ctx.save();
            ctx.fillStyle = "#FFF9F2";
            ctx.fillRect(slotX, slotY, slotW, slotH);
            ctx.restore();
          }
        }

        // লেয়ার ২: মূল স্বচ্ছ ফ্রেম
        ctx.drawImage(baseImg, 0, 0, origWidth, origHeight);

        // লেয়ার ৩: টেক্সট ওভারলে (অটো-প্রিফিক্স, ফন্ট ও সঠিক অ্যালাইনমেন্ট সহ)
        if (activeTemplate.inputFields) {
          const previewWidth = document.getElementById("editorCanvasWrapper").clientWidth || 360;
          const trueScaleRatio = origWidth / previewWidth;

          activeTemplate.inputFields.forEach(f => {
            const rawVal = textState[f.id] !== undefined ? textState[f.id] : (f.placeholder || "");
            const fullText = (f.prefix || "") + rawVal;

            const posX = (origWidth * f.x) / 100;
            const posY = (origHeight * f.y) / 100;

            const displayFont = Math.max(6, (f.fontSize || 16) * 0.45);
            const finalPx = displayFont * trueScaleRatio;
            const fontFam = f.fontFamily || "Hind Siliguri";

            ctx.font = `bold ${finalPx}px '${fontFam}', sans-serif`;
            ctx.fillStyle = f.textColor || "#000000";
            ctx.textAlign = f.align || "center";
            ctx.textBaseline = "middle";
            ctx.fillText(fullText, posX, posY);
          });
        }

        const link = document.createElement("a");
        link.download = `${activeTemplate.title || 'banner'}_original.png`;
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();

        btn.innerHTML = `<span>ডাউনলোড</span><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>`;
        btn.disabled = false;
      };
    });

    loadSliders();
    loadData();
  </script>
</body>
</html>
