<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartesia AI Voice Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #38bdf8;
      text-align: center;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-weight: 600;
    }
    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: #38bdf8;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .output-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #334155;
      display: none;
    }
    audio {
      width: 100%;
      margin-top: 10px;
      outline: none;
    }
    .download-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      background: #10b981;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
      font-weight: bold;
    }
    .download-btn:hover {
      background: #059669;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
    }
    .error {
      color: #f87171;
    }
    .success {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Cartesia Voice Studio</h2>
    <p class="subtitle">টেক্সট লিখুন এবং মানুষের মতো প্রাকৃতিক ভয়েস শুনুন</p>

    <div class="form-group">
      <label for="apiKey">Cartesia API Key</label>
      <input type="text" id="apiKey" value="Sk_car_kCqnitjkBaJE6QSLGtemB5" placeholder="আপনার API Key বসান" />
    </div>

    <div class="form-group">
      <label for="voiceSelect">ভয়েস নির্বাচন করুন</label>
      <select id="voiceSelect">
        <option value="a0e99841-438c-4a64-b679-ae501e7d6091">Barbershop Man (পুরুষ কণ্ঠ)</option>
        <option value="694f124f-377f-459e-9543-986f31f00f01">Friendly Guide - Skylar (নারী কণ্ঠ)</option>
        <option value="db6b0ed5-d5d3-463d-b2a6-2187b5a59339">Modern Assistant - Daniel (পুরুষ কণ্ঠ)</option>
        <option value="fb26447f-308b-471e-8b00-8e9f04284eb5">Decisive Agent - Gemma (নারী কণ্ঠ)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="textInput">টেক্সট বা স্ক্রিপ্ট লিখুন</label>
      <textarea id="textInput" placeholder="এখানে আপনার কথা বা স্ক্রিপ্ট লিখুন...">Hello! Welcome to Cartesia real-time voice generation.</textarea>
    </div>

    <button id="generateBtn" class="btn" onclick="generateVoice()">
      <span id="btnText">ভয়েস তৈরি করুন</span>
    </button>

    <div id="status" class="status-msg"></div>

    <div id="outputSection" class="output-section">
      <label>প্লেয়ার ও ডাউনলোড</label>
      <audio id="audioPlayer" controls></audio>
      <a id="downloadLink" class="download-btn" href="#" download="cartesia-voice.mp3">MP3 অডিও ডাউনলোড করুন</a>
    </div>
  </div>

  <script>
    async function generateVoice() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const text = document.getElementById('textInput').value.trim();
      const voiceId = document.getElementById('voiceSelect').value;
      const generateBtn = document.getElementById('generateBtn');
      const btnText = document.getElementById('btnText');
      const status = document.getElementById('status');
      const outputSection = document.getElementById('outputSection');
      const audioPlayer = document.getElementById('audioPlayer');
      const downloadLink = document.getElementById('downloadLink');

      if (!apiKey) {
        status.className = 'status-msg error';
        status.innerText = 'অনুগ্রহ করে API Key প্রবেশ করান।';
        return;
      }

      if (!text) {
        status.className = 'status-msg error';
        status.innerText = 'অনুগ্রহ করে কিছু টেক্সট লিখুন।';
        return;
      }

      generateBtn.disabled = true;
      btnText.innerText = 'ভয়েস প্রস্তুত হচ্ছে...';
      status.className = 'status-msg';
      status.innerText = 'কার্তেশিয়া সার্ভারের সাথে সংযোগ করা হচ্ছে...';
      outputSection.style.display = 'none';

      try {
        const response = await fetch('https://api.cartesia.ai/tts/bytes', {
          method: 'POST',
          headers: {
            'X-API-Key': apiKey,
            'Cartesia-Version': '2024-06-10',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model_id: 'sonic-3.6',
            transcript: text,
            voice: {
              mode: 'id',
              id: voiceId
            },
            output_format: {
              container: 'mp3',
              encoding: 'mp3',
              sample_rate: 44100,
              bit_rate: 128000
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || `সার্ভার ত্রুটি: ${response.status}`);
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        downloadLink.download = `voice-${Date.now()}.mp3`;

        outputSection.style.display = 'block';
        audioPlayer.play();

        status.className = 'status-msg success';
        status.innerText = 'ভয়েস সফলভাবে তৈরি হয়েছে!';
      } catch (err) {
        status.className = 'status-msg error';
        status.innerText = 'সমস্যা হয়েছে: ' + err.message;
      } finally {
        generateBtn.disabled = false;
        btnText.innerText = 'ভয়েস তৈরি করুন';
      }
    }
  </script>
</body>
</html>
